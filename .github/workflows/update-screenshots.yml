name: Update the skin screenshots

# The ADR-007 baselines in tests/e2e/__screenshots__ are pixel comparisons of
# text, and text rasterizes differently between a development sandbox and the
# GitHub runner, so the baselines have to be generated on the runner that gates
# them. Two ways in:
#
#   - From the Actions tab, against any branch. This only appears once the file
#     has reached the default branch, which is how workflow_dispatch works.
#   - By pushing a commit whose message contains [update-screenshots], which is
#     the only route available from a branch before that.
#
# Either way, review the committed images before merging.
on:
  workflow_dispatch:
  push:
    branches: ['**']

permissions:
  contents: write

jobs:
  update:
    name: Regenerate and commit the baselines
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, '[update-screenshots]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Install the Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Regenerate the baselines
        run: npm run test:e2e:update

      - name: Commit them if they changed
        run: |
          if git diff --quiet -- tests/e2e/__screenshots__; then
            echo "No baseline changed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/e2e/__screenshots__
          git commit -m "Regenerate the skin baselines on the GitHub runner

          Generated by .github/workflows/update-screenshots.yml, so the
          per-skin visual regression compares like with like."
          git push origin HEAD:${{ github.ref_name }}
