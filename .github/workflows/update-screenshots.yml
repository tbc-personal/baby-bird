name: Update the skin screenshots

# Manual only. The ADR-007 baselines in tests/e2e/__screenshots__ are pixel
# comparisons of text, and text rasterises differently between a development
# sandbox and the GitHub runner, so the baselines have to be generated on the
# runner that gates them. Run this from the Actions tab against the branch whose
# baselines need regenerating, then review the committed images before merging.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    name: Regenerate and commit the baselines
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Install the Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Regenerate the baselines
        run: npm run test:e2e:update

      - name: Commit them if they changed
        run: |
          if git diff --quiet -- tests/e2e/__screenshots__; then
            echo "No baseline changed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/e2e/__screenshots__
          git commit -m "Regenerate the skin baselines on the GitHub runner

          Generated by .github/workflows/update-screenshots.yml, so the
          per-skin visual regression compares like with like."
          git push origin HEAD:${{ github.ref_name }}
