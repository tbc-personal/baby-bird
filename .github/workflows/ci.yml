name: CI

# Every push to every branch, so work is checked as it is written rather than
# only once a pull request exists. Restricting `push` to the default branch meant
# a branch could accumulate any number of commits with no CI at all: this one
# reached seventeen, and nothing ran until a merge commit landed on the PR.
#
# Running `push` and `pull_request` together is what caused the double builds
# this trigger was narrowed to stop. Two changes prevent that instead:
#
#   - `pull_request` drops `synchronize`, so a push to a branch with an open PR
#     fires one event, not two. What is left is the merge-commit check at the
#     moment a PR opens, which is the one thing a `push` run cannot do — it
#     builds the head alone, not head merged into the base.
#   - The concurrency group keys on the *head branch* rather than `github.ref`.
#     That was the real bug: a push reports `refs/heads/x` and a pull_request
#     reports `refs/pull/N/merge`, so the two never shared a group and neither
#     could cancel the other.
on:
  push:
    branches: ['**']
  pull_request:
    types: [opened, reopened, ready_for_review]

# Cancel a superseded run rather than paying for both. The fallback covers push
# events, where `github.event.pull_request` is null.
concurrency:
  group: ci-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, types, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint (ESLint and the ADR-007 no-literal-colors rule)
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Validate data/comparisons.json
        run: npm run validate-data

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build

      # Downloading Chromium was the single longest step in the job, longer than
      # every test put together.
      - name: Cache the Playwright browser
        id: playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install the Playwright browser
        if: steps.playwright.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install the browser's system dependencies
        if: steps.playwright.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Playwright smoke and PWA tests
        # The blocking gate: setup to today to timeline to the week card, plus
        # installability, real offline operation, and the ADR-006 guarantee that
        # a shared ?m=&d= link never reaches the cache.
        run: npm run test:e2e:smoke

      # A commit that deliberately changes how the app looks marks itself
      # `[update-screenshots]`, and `update-screenshots.yml` regenerates the
      # baselines and commits them. That workflow runs alongside this one rather
      # than before it, so comparing against the old baselines here only ever
      # produces a red run that a bot commit then fixes. Skip the comparison on
      # those commits and let the regenerated baselines be checked by the next
      # push that does not carry the marker.
      - name: Does this commit regenerate the baselines?
        id: baselines
        env:
          GH_TOKEN: ${{ github.token }}
          # On a pull_request run, HEAD is a merge commit whose message is
          # GitHub's, not the author's; the PR head is the commit to ask about.
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          # The subject line only. A commit that merely mentions the marker in its
          # body is talking about it, not asking for it — which is exactly what the
          # commit introducing this step did: it skipped its own visual check and
          # set a pointless baseline regeneration running.
          subject="$(gh api "repos/${{ github.repository }}/commits/$SHA" --jq '.commit.message' | head -n 1)"
          if printf '%s' "$subject" | grep -qF '[update-screenshots]'; then
            echo 'regenerating=true' >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping the visual regression: $SHA asks for new baselines."
          else
            echo 'regenerating=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Per-skin visual regression (ADR-007)
        if: steps.baselines.outputs.regenerating != 'true'
        run: npm run test:e2e:visual

      - name: Upload the Playwright report when something fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
