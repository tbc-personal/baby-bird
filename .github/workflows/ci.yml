name: CI

on:
  push:
    branches: ['**']
  pull_request:

# Cancel a superseded run rather than paying for both.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, types, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint (ESLint and the ADR-007 no-literal-colors rule)
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Validate data/comparisons.json
        run: npm run validate-data

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build

      - name: Install the Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Playwright smoke and PWA tests
        # The blocking gate: setup to today to timeline to the week card, plus
        # installability, real offline operation, and the ADR-006 guarantee that
        # a shared ?m=&d= link never reaches the cache.
        run: npm run test:e2e:smoke

      - name: Per-skin visual regression (ADR-007)
        run: npm run test:e2e:visual

      - name: Upload the Playwright report when something fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
